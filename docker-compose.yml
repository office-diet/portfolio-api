version: "3.9"

services:
  db:
    image: postgres:15
    container_name: sample-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: sampledb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sample-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/sampledb
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: sample-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
