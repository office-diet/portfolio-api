version: "3.9"

services:
  db:
    image: postgres:15
    container_name: aichat-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: aichat-backend
    ports:
      - "3000:3000"
    environment:
      DB_URL: ${DB_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: aichat-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  db-data:
